<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realty Boris | Official Contact</title>
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(145deg, #04140d 0%, #092c1d 45%, #0e3e29 80%, #03100a 100%);
      --card-bg: rgba(12, 48, 32, 0.45);
      --card-border: rgba(255, 255, 255, 0.12);
      --glow-emerald: rgba(16, 185, 129, 0.25);
      --text-main: #ffffff;
      --text-muted: rgba(209, 250, 229, 0.75);
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      font-family: var(--font-body);
      color: var(--text-main);
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient slow-motion background glows */
    .bg-glow-1 {
      position: absolute;
      top: -150px;
      left: -150px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      filter: blur(50px);
      animation: pulseGlow 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: -150px;
      right: -150px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      filter: blur(50px);
      animation: pulseGlow 10s ease-in-out infinite alternate-reverse;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      100% { transform: scale(1.2) translate(30px, 30px); opacity: 1; }
    }

    /* Minimalist Glass Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 44px 36px;
      max-width: 410px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
      z-index: 10;
      animation: slowReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slowReveal {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Profile Photo / Avatar Styling with Floating Animation */
    .avatar-wrapper {
      position: relative;
      width: 108px;
      height: 108px;
      margin: 0 auto 20px;
      animation: slowFloat 6s ease-in-out infinite alternate;
    }

    @keyframes slowFloat {
      0% { transform: translateY(-4px); }
      100% { transform: translateY(6px); }
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.4),
        0 0 25px var(--glow-emerald);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .avatar-wrapper:hover .avatar-img {
      border-color: rgba(52, 211, 153, 0.8);
      box-shadow: 
        0 12px 35px rgba(0, 0, 0, 0.5),
        0 0 35px rgba(16, 185, 129, 0.5);
    }

    /* Verified Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #34d399;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .badge svg {
      width: 12px;
      height: 12px;
    }

    /* Typography */
    h1 {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 32px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* Action Links Container */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Buttons Styling & Micro-interactions */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 22px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 0.98rem;
      font-weight: 600;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.3s ease,
                  border-color 0.3s ease;
      opacity: 0;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .btn:nth-child(1) { animation-delay: 0.2s; }
    .btn:nth-child(2) { animation-delay: 0.3s; }
    .btn:nth-child(3) { animation-delay: 0.4s; }
    .btn:nth-child(4) { animation-delay: 0.5s; }

    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.01);
    }

    .btn:active {
      transform: translateY(0) scale(0.99);
    }

    .btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .btn:hover svg {
      transform: scale(1.15);
    }

    /* Button Variants */
    .btn-website {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.35) 0%, rgba(5, 150, 105, 0.45) 100%);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
    }
    .btn-website:hover {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.5) 0%, rgba(5, 150, 105, 0.6) 100%);
      border-color: rgba(52, 211, 153, 0.8);
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.25);
    }
    .btn-whatsapp:hover {
      box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4);
    }

    .btn-phone {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }
    .btn-phone:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .btn-email {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
    }
    .btn-email:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Footer */
    footer {
      margin-top: 32px;
      font-size: 0.78rem;
      color: rgba(209, 250, 229, 0.45);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
        border-radius: 24px;
      }
      h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>

</body>
</html>
